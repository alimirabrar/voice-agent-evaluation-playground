[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-agent-evaluation-playground"
version = "0.1.0"
description = "A small, model-agnostic evaluator for structured voice-agent traces."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
voice-eval = "voice_eval.cli:main"

[tool.setuptools]
packages = ["voice_eval"]
